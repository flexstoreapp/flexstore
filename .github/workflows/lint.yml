name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install Composer Dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: '--prefer-dist'

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      # resources/js/actions, resources/js/routes and types/translations.ts are
      # generated, not committed. ESLint cannot resolve @/actions imports and
      # tsc cannot resolve TranslationKey until the build has written them.
      - name: Build Assets
        run: npm run build

      - name: Run Lint
        run: composer lint

      - name: Check Types
        run: npm run types:check

      - name: Static Analysis
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: fix code style
          commit_options: '--no-verify'
